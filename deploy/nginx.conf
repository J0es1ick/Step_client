server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /health { access_log off; return 200 'ok'; }
    # Docker DNS is resolved on request, so the demo image works without an API.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend http://api:5200;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /media/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
