name: Validate and preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DEMO_BASE_PATH: ${{ vars.DEMO_BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npm run build:demo
      - run: node scripts/check-demo-build.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t step-web .
      - run: |
          docker run -d --name step-web -p 127.0.0.1:8080:80 step-web
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs step-web
          exit 1
  pages:
    if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [validate, docker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
